<section class="hero-wrap js-fullheight" style="background-image: url('images/bg_1.jpg');" data-stellar-background-ratio="0.5">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text js-fullheight align-items-end justify-content-center">
          <div class="col-md-12 ftco-animate pb-5 mb-3 text-center">
            <h1 class="mb-3 bread">Projects</h1>
            <p class="breadcrumbs"><span class="mr-2"><a routerLink="/">Home <i class="ion-ios-arrow-forward"></i></a></span> <span>All Projects <i class="ion-ios-arrow-forward"></i></span></p>
          </div>
        </div>
      </div>
    </section>

    <section class="ftco-section">
      <div class="container">
        <div class="row justify-content-between align-items-center mb-4 filters-bar">
          <div class="col-md-4 col-lg-3">
            <input
              type="text"
              class="form-control filters-bar__search"
              placeholder="Search projects…"
              [value]="searchTerm()"
              (input)="setSearch($any($event.target).value)"
            />
          </div>
          <div class="col-md-4 col-lg-3">
            <select
              class="form-control filters-bar__select"
              aria-label="Filter by year"
              [value]="selectedYear()"
              (change)="setYear($any($event.target).value)"
            >
              <option value="all">All years</option>
              @for (year of years; track year) {
                <option [value]="year">{{ year }}</option>
              }
            </select>
          </div>
          <div class="col-md-4 col-lg-3">
            <select
              class="form-control filters-bar__select"
              aria-label="Filter by technology"
              [value]="selectedTech()"
              (change)="setTech($any($event.target).value)"
            >
              <option value="all">All technologies</option>
              @for (tech of technologies; track tech) {
                <option [value]="tech">{{ tech }}</option>
              }
            </select>
          </div>
          <div class="col-md-12 col-lg-2 text-md-left text-lg-right mt-2 mt-lg-0">
            <button type="button" class="filters-bar__reset" (click)="resetFilters()">Reset</button>
          </div>
        </div>

        <div class="row">
          @for (project of filteredProjects(); track project.id) {
            <div class="col-md-4">
              <div class="project img ftco-animate d-flex justify-content-center align-items-center"
                [style.background-image]="'url(' + project.image + ')'">
                <div class="overlay"></div>
                <div class="text text-center p-4">
                  <h3><a [routerLink]="['/project', project.id]">{{ project.title }}</a></h3>
                  <span>{{ project.category }} · {{ project.createdAt.getFullYear() }}</span>
                </div>
              </div>
            </div>
          } @empty {
            <div class="col-12 text-center ftco-animate">
              <p class="mb-3">No projects match your filters.</p>
              <button type="button" class="btn btn-primary py-3 px-4" (click)="resetFilters()">
                Reset filters
              </button>
            </div>
          }
        </div>
      </div>
    </section>
