<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>diag</title>
  <link rel="stylesheet" href="/css/owl.carousel.min.css">
</head>
<body>
<div id="ftco-loader" class="show fullscreen">LOADER</div>
<div class="home-slider owl-carousel">
  <div class="slider-item" style="height:200px">slide a</div>
  <div class="slider-item" style="height:200px">slide b</div>
</div>
<div class="js-fullheight" style="height:100px">h</div>
<div class="ftco-about"><span class="number" data-number="120">0</span></div>

<script src="/js/jquery.min.js"></script>
<script src="/js/popper.min.js"></script>
<script src="/js/bootstrap.min.js"></script>
<script src="/js/jquery.easing.1.3.js"></script>
<script src="/js/jquery.waypoints.min.js"></script>
<script src="/js/jquery.stellar.min.js"></script>
<script src="/js/owl.carousel.min.js"></script>
<script src="/js/jquery.magnific-popup.min.js"></script>
<script src="/js/aos.js"></script>
<script src="/js/jquery.animateNumber.min.js"></script>
<script src="/js/scrollax.min.js"></script>
<script src="/js/main.js"></script>

<script>
  var res = document.getElementById('diag-result');
  window.addEventListener('load', function() {
    var out = [];
    out.push('jquery:' + (typeof jQuery !== 'undefined' ? 'yes' : 'no'));
    out.push('owlCarousel:' + (jQuery.fn.owlCarousel ? 'yes' : 'no'));
    out.push('waypoint:' + (jQuery.fn.waypoint ? 'yes' : 'no'));
    out.push('stellar:' + (jQuery.fn.stellar ? 'yes' : 'no'));
    out.push('scrollax:' + (jQuery.Scrollax ? 'yes' : 'no'));
    out.push('magnific:' + (jQuery.fn.magnificPopup ? 'yes' : 'no'));
    out.push('aos:' + (typeof AOS !== 'undefined' ? 'yes' : 'no'));
    out.push('easing:' + (jQuery.fn.easing ? 'yes' : 'no'));
    try {
      window.clarkInit();
      out.push('clarkInit:ok');
    } catch (e) {
      out.push('clarkInit:THREW ' + e.message);
    }
    out.push('loaderShow:' + jQuery('#ftco-loader').hasClass('show'));
    out.push('owlStage:' + jQuery('.home-slider .owl-stage').length);
    res.textContent = out.join(' | ');
  });
</script>
<pre id="diag-result"></pre>
</body>
</html>
